name: Benchmark RSS diagnose

on:
  workflow_dispatch:
  push:
    branches: [fix/benchmark-rss]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action commit
        with:
          toolchain: 1.99.1
      - run: cargo build --release --locked -p oxido-benchmark
      - run: |
          for i in 1 2 3 4 5; do
            echo "=== ejecución $i"
            ./target/release/oxido-benchmark
          done
