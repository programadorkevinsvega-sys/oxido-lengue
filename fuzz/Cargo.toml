[package]
name = "oxido-language-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.oxido-language]
path = "../crates/oxido-language"

[dependencies.oxido-compiler]
path = "../crates/oxido-compiler"

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backend"
path = "fuzz_targets/backend.rs"
test = false
doc = false
bench = false
