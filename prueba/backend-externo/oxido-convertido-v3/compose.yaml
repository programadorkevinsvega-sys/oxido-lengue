services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      RUNTIME_DATABASE_USER: ${RUNTIME_DATABASE_USER:?Set RUNTIME_DATABASE_USER}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?Set RUNTIME_DATABASE_PASSWORD}
      COMMERCIAL_BILLING_DATABASE_USER: ${COMMERCIAL_BILLING_DATABASE_USER:?Set COMMERCIAL_BILLING_DATABASE_USER}
      COMMERCIAL_BILLING_DATABASE_PASSWORD: ${COMMERCIAL_BILLING_DATABASE_PASSWORD:?Set COMMERCIAL_BILLING_DATABASE_PASSWORD}
      PLATFORM_CONTROL_DATABASE_USER: ${PLATFORM_CONTROL_DATABASE_USER:?Set PLATFORM_CONTROL_DATABASE_USER}
      PLATFORM_CONTROL_DATABASE_PASSWORD: ${PLATFORM_CONTROL_DATABASE_PASSWORD:?Set PLATFORM_CONTROL_DATABASE_PASSWORD}
      NOTIFICATIONS_DATABASE_USER: ${NOTIFICATIONS_DATABASE_USER:?Set NOTIFICATIONS_DATABASE_USER}
      NOTIFICATIONS_DATABASE_PASSWORD: ${NOTIFICATIONS_DATABASE_PASSWORD:?Set NOTIFICATIONS_DATABASE_PASSWORD}
      REALTIME_DATABASE_USER: ${REALTIME_DATABASE_USER:?Set REALTIME_DATABASE_USER}
      REALTIME_DATABASE_PASSWORD: ${REALTIME_DATABASE_PASSWORD:?Set REALTIME_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/001-context-roles.sh:/docker-entrypoint-initdb.d/001-context-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 30

  nats:
    image: nats:2.15.1-alpine@sha256:2ae57dfba3063d5e25fecb75256118c0882a1a2d2cf7d0fba17a7c701df956f6
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222", "--user=${NATS_USERNAME:?Set NATS_USERNAME}", "--pass=${NATS_PASSWORD:?Set NATS_PASSWORD}"]
    ports:
      - "127.0.0.1:${NATS_PORT:?Set NATS_PORT}:4222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:?Set REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
  nats-data:
