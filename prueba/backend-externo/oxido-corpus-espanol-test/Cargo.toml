[workspace]
resolver = "3"
members = [
  "apps/bff",
  "apps/migrator",
  "apps/module-runtime",
  "apps/platform-operator-provisioner",
  "platform",
  "shared-kernel",
  "modules/identity",
  "modules/tenancy-access",
  "modules/commercial-billing",
  "modules/usage-ledger",
  "modules/provider-catalog",
  "modules/integrations",
  "modules/projects",
  "modules/financial-research",
  "modules/generation",
  "modules/asset-storage",
  "modules/jobs",
  "modules/media-pipeline",
  "modules/approvals",
  "modules/publishing",
  "modules/analytics",
  "modules/notifications",
  "modules/realtime",
  "modules/audit",
  "modules/platform-control",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.99.1"

[workspace.dependencies]
argon2 = "0.5.3"
aws-credential-types = "1.2.8"
aws-sdk-s3 = "1.146.1"
base64 = "0.22.1"
async-nats = { version = "0.50.0", features = ["jetstream"] }
futures-util = "0.3.31"
axum = { version = "0.8.9", features = ["http2", "macros"] }
dotenvy = "0.15.7"
getrandom = "0.3.4"
hmac = "0.12.1"
http = "1.3.1"
opentelemetry = { version = "0.31.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["trace"] }
prost = "0.14.3"
prost-build = "0.14.4"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
xovyra-shared-kernel = { path = "shared-kernel" }
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring", "uuid"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "signal", "sync", "time", "rt-multi-thread"] }
tokio-stream = "0.1.18"
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-health = "0.14.6"
tracing = "0.1.41"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tower = "0.5.2"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
protoc-bin-vendored = "3.2.0"
utoipa = { version = "6.0.0", features = ["axum_extras"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
