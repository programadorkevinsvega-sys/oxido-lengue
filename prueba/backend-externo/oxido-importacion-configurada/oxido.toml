[cargo.manifest.workspace]
members = [
    "apps/bff",
    "apps/migrator",
    "apps/module-runtime",
    "apps/platform-operator-provisioner",
    "platform",
    "shared-kernel",
    "modules/identity",
    "modules/tenancy-access",
    "modules/commercial-billing",
    "modules/usage-ledger",
    "modules/provider-catalog",
    "modules/integrations",
    "modules/projects",
    "modules/financial-research",
    "modules/generation",
    "modules/asset-storage",
    "modules/jobs",
    "modules/media-pipeline",
    "modules/approvals",
    "modules/publishing",
    "modules/analytics",
    "modules/notifications",
    "modules/realtime",
    "modules/audit",
    "modules/platform-control",
]
resolver = "3"

[cargo.manifest.workspace.dependencies]
argon2 = "0.5.3"
aws-credential-types = "1.2.8"
aws-sdk-s3 = "1.146.1"
base64 = "0.22.1"
dotenvy = "0.15.7"
futures-util = "0.3.31"
getrandom = "0.3.4"
hmac = "0.12.1"
http = "1.3.1"
prost = "0.14.3"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio-stream = "0.1.18"
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.2"
tracing = "0.1.41"
tracing-opentelemetry = "0.32.0"

[cargo.manifest.workspace.dependencies.async-nats]
features = ["jetstream"]
version = "0.50.0"

[cargo.manifest.workspace.dependencies.axum]
features = [
    "http2",
    "macros",
]
version = "0.8.9"

[cargo.manifest.workspace.dependencies.opentelemetry]
features = ["trace"]
version = "0.31.0"

[cargo.manifest.workspace.dependencies.opentelemetry_sdk]
features = ["trace"]
version = "0.31.0"

[cargo.manifest.workspace.dependencies.redis]
features = [
    "tokio-comp",
    "connection-manager",
]
version = "1.7.1"

[cargo.manifest.workspace.dependencies.reqwest]
default-features = false
features = [
    "form",
    "json",
    "rustls",
]
version = "0.13.5"

[cargo.manifest.workspace.dependencies.serde]
features = ["derive"]
version = "1.0.228"

[cargo.manifest.workspace.dependencies.sqlx]
default-features = false
features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
    "uuid",
]
version = "0.9.0"

[cargo.manifest.workspace.dependencies.tokio]
features = [
    "macros",
    "net",
    "process",
    "signal",
    "sync",
    "time",
    "rt-multi-thread",
]
version = "1.48.0"

[cargo.manifest.workspace.dependencies.tonic]
features = ["transport"]
version = "0.14.6"

[cargo.manifest.workspace.dependencies.tracing-subscriber]
features = [
    "env-filter",
    "json",
]
version = "0.3.20"

[cargo.manifest.workspace.dependencies.utoipa]
features = ["axum_extras"]
version = "6.0.0"

[cargo.manifest.workspace.dependencies.uuid]
features = [
    "serde",
    "v4",
]
version = "1.18.1"

[cargo.manifest.workspace.dependencies.xovyra-shared-kernel]
path = "shared-kernel"

[cargo.manifest.workspace.lints.clippy]
all = "deny"

[cargo.manifest.workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[cargo.manifest.workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.99.1"

[language]
edition = "2024"
syntax = "braces"
