[package]
name = "crud-sqlite-exportado-oxido"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "crud-api-exportado"
path = "src/main.rs"

[[bin]]
name = "verificar-persistencia-exportado"
path = "src/bin/verificar_persistencia.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
